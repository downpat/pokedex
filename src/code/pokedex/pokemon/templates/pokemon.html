<html>
  <head>
    <title>Pokemon: {{ pokemon.name }}</title>
  </head>
  <body>
    <h2>{{ pokemon.name }}</h2>
    <ul>
      <li><strong>Type:</strong>{{ pokemon.main_type }}</li>
      <li><strong>HP:</strong>{{ pokemon.base_hp }}</li>
      <li><strong>Height:</strong>{{ pokemon.height }}</li>
      <li><strong>Weight:</strong>{{ pokemon.weight }}</li>
    </ul>
  </body>
</html>
